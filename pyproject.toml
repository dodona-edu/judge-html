[tool.coverage.run]
omit = [
    ".github/*",
    "docs/*",
    "htmlcov/*",
    "*/site-packages/*",
    "tests/*",
    "venv/*",
]
source = ["."]

[tool.ruff]
line-length = 120
# Keep in step with .tool-versions; ruff defaults to py310 and can't infer it without a [project] table.
target-version = "py313"
