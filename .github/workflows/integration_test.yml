name: Integration test

on:
  push:

jobs:
  integration-test:
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}

  # codecov-action needs curl and gpg, which the slim production image doesn't ship.
  # We'd rather not add packages to the environment the test is meant to exercise.
  coverage:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Code Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
