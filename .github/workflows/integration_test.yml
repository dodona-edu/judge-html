name: Integration test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dodona-edu/dodona-html:latest
      options: --user root

    steps:
      - uses: actions/checkout@v7
      - name: Check requirements.txt matches the image
        run: python devel/check_requirements_match_image.py
      - name: Install test dependencies
        run: ./devel/install_test_deps.sh
      - name: Run tests
        run: ./devel/run-tests.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  # codecov-action needs curl and gpg, which the slim production image doesn't ship.
  # We'd rather not add packages to the environment the test is meant to exercise.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Code Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
