name: Test

on:
  push:

jobs:
  # A drift canary as much as a check on the proposal: the same pins resolved fresh
  # against today's transitives, so red here while integration-test stays green
  # means rebuilding the image today would break the judge.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # A fresh install of the pins requirements.txt declares is the proposed
      # environment: a dropped pin is absent by construction, and the transitives
      # resolve against the proposed versions, like the candidate image docker-images
      # builds once a proposal graduates. integration-test covers the image.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".tool-versions"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install the packages requirements.txt lists
        run: ./devel/install_deps.sh
      - name: Install test dependencies
        run: ./devel/install_test_deps.sh
      - name: Run tests
        run: ./devel/run-tests.sh

  # Advisory by design: a typings straddle during a dependency bump window can need a
  # narrow `ty: ignore` or small typed shim.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # A fresh install of the pins requirements.txt declares is the proposed
      # environment: a dropped pin is absent by construction, and the transitives
      # resolve against the proposed versions, like the candidate image docker-images
      # builds once a proposal graduates. integration-lint covers the image.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".tool-versions"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt
      - name: Install the packages requirements.txt lists
        run: ./devel/install_deps.sh
      - name: Install dev dependencies
        run: ./devel/install_dev_deps.sh
      - name: Run the linters
        run: ./devel/check.sh
